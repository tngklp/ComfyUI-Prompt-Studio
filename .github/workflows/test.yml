name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r standalone/requirements.txt

      - name: Install DOM test dependency
        run: npm ci --ignore-scripts

      # unittest shells out to tests/frontend_regressions.mjs via
      # test_frontend_regressions.py, so that one file must not also be listed here.
      - name: Run Python and frontend tests
        env:
          PYTHONPATH: tests/ci_stubs
        run: python -m unittest discover -s tests -p "test_*.py"

      # The remaining .mjs suites. main_smoke.mjs loads the real web/main.js in a
      # vm module, which is the only check that catches a free variable like
      # "targetForMode is not defined"; it needs --experimental-vm-modules.
      # It guards itself with vm.SourceTextModule and skips without the flag, so
      # it is run on its own here rather than silently skipping.
      - name: Run frontend tests
        run: node --test tests/*.mjs

      - name: Run frontend module smoke test
        run: node --experimental-vm-modules --test tests/main_smoke.mjs

      - name: Run Standalone tests
        env:
          PYTHONPATH: standalone:standalone/prompt_studio/compat:.
        run: python -m unittest discover -s standalone/tests -p "test_*.py"

      - name: Run Standalone frontend tests
        run: node --test standalone/tests/frontend.mjs
