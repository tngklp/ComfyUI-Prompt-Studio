name: Publish to ComfyUI Registry

# The Comfy Registry publishes the ComfyUI EXTENSION only. Two release lines live
# on main: `v<extension>` for the extension and `standalone-v<standalone>` for the
# Windows Standalone, which is not a ComfyUI node and must never be published here.
# The job-level `if` below is what keeps the standalone releases out.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    # Publish for an extension release tag (`v1.1.5`) and for a manual dispatch.
    # This rejects the standalone line (`standalone-v1.1.5`) and any other tag.
    # The workflow_dispatch arm matters: on a manual run github.event.release does
    # not exist, so a bare startsWith() check would skip the job every time.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
