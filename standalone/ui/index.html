<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101114; color: #e8e9eb; }
    .host-shell { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 8px; }
    .host-shell strong { font-size: 22px; }
    .host-shell span { color: #9297a1; font-size: 13px; }
    html[data-ps-standalone-shell="ready"] .host-shell { display: none; }
  </style>
  <link rel="icon" href="./assets/prompt-studio-launcher.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main class="host-shell" aria-live="polite">
    <strong>Prompt Studio</strong>
    <span data-host-status>Starting the local Prompt Studio…</span>
  </main>
  <script type="module" src="/scripts/boot.js"></script>
</body>
</html>
