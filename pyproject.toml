[project]
name = "comfyui-prompt-studio"
version = "1.1.6"
description = "Multimodal prompt studio for ComfyUI. Write and refine prompts for image, video and audio models using local or API-based LLMs."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/tngklp/ComfyUI-Prompt-Studio"
Documentation = "https://github.com/tngklp/ComfyUI-Prompt-Studio#readme"
Issues = "https://github.com/tngklp/ComfyUI-Prompt-Studio/issues"

[tool.comfy]
PublisherId = "tngklp"
DisplayName = "Prompt Studio"
Icon = "https://raw.githubusercontent.com/tngklp/ComfyUI-Prompt-Studio/main/web/assets/prompt-studio-launcher.svg"