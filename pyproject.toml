[project]
name = "prompt-studio"
version = "1.1.2"
description = "A multimodal prompt studio for ComfyUI with local and API providers, supporting multiple generation-target models."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/tngklp/ComfyUI-Prompt-Studio"
Documentation = "https://github.com/tngklp/ComfyUI-Prompt-Studio#readme"
"Bug Tracker" = "https://github.com/tngklp/ComfyUI-Prompt-Studio/issues"

[tool.comfy]
PublisherId = "tngklp"
DisplayName = "Prompt Studio"
Icon = "https://raw.githubusercontent.com/tngklp/ComfyUI-Prompt-Studio/main/web/assets/prompt-studio-launcher.svg"
